<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - 智云优选</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h2>智云优选 · 后台登录</h2>
    <div class="sub">AI 电商在线销售系统</div>
    <label>账号</label>
    <input id="user" placeholder="请输入管理员账号">
    <label>密码</label>
    <input id="pass" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="err" id="err"></div>
    <div class="tip">演示账号：admin &nbsp; 密码：123456<br><a href="index.html">← 返回商城首页</a></div>
  </div>
</div>
<script>
function doLogin(){
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value.trim();
  if(u === "admin" && p === "123456"){
    sessionStorage.setItem("zy_admin", "1");
    location.href = "admin.html";
  } else {
    document.getElementById("err").textContent = "账号或密码错误，请重试（admin / 123456）";
  }
}
</script>
</body>
</html>
